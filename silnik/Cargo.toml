[package]
name = "rust-ecs-3d"
version = "0.1.0"
edition = "2021"
rust-version = "1.92"
description = "Prototyp silnika 3D z archetypowym ECS i grą demonstracyjną"
default-run = "survivor3d"

[features]
default = ["graphics"]
graphics = ["dep:bytemuck", "dep:wgpu", "dep:winit", "dep:egui", "dep:egui-wgpu", "dep:egui-winit", "dep:pollster", "dep:png"]

[dependencies]
glam = "=0.27.0"
bytemuck = { version = "=1.25.0", features = ["derive"], optional = true }
wgpu = { version = "=0.20.1", optional = true }
winit = { version = "=0.29.15", optional = true }
egui = { version = "=0.28.1", optional = true }
egui-wgpu = { version = "=0.28.1", optional = true }
egui-winit = { version = "=0.28.1", default-features = false, optional = true }
pollster = { version = "=0.3.0", optional = true }
png = { version = "=0.17.16", optional = true }

[[bin]]
name = "survivor3d"
path = "src/main.rs"
required-features = ["graphics"]

[[bin]]
name = "headless"
path = "src/bin/headless.rs"

[profile.release]
lto = "thin"
codegen-units = 1

